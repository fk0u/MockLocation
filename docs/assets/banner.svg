<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">Mock Location</title>
  <desc id="d">Banner aplikasi Mock Location: peta gelap dengan rute putus-putus dan titik lokasi live yang berdenyut.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E13"/>
      <stop offset="1" stop-color="#0E1A22"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5EEAD4" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>
    <radialGradient id="beam" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(930 214) scale(70)">
      <stop offset="0" stop-color="#FF4D6D" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF4D6D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <rect width="1280" height="420" fill="url(#glow)"/>

  <!-- stylised streets -->
  <g fill="none" stroke="#1F2B3A" stroke-linecap="round">
    <path d="M640 -10 C700 120 690 260 760 430" stroke-width="14"/>
    <path d="M600 330 C760 300 930 320 1290 250" stroke-width="12"/>
    <path d="M700 60 C850 110 1000 90 1290 140" stroke-width="10"/>
    <path d="M1080 -10 C1060 150 1110 300 1090 430" stroke-width="9"/>
    <path d="M820 430 C860 330 880 200 960 -10" stroke-width="7"/>
  </g>

  <!-- route -->
  <path d="M760 300 L850 170 L1010 220 L1120 110" fill="none" stroke="#5EEAD4" stroke-opacity="0.25" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M760 300 L850 170 L1010 220 L1120 110" fill="none" stroke="#5EEAD4" stroke-width="4" stroke-dasharray="12 9" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="stroke-dashoffset" from="42" to="0" dur="1.6s" repeatCount="indefinite"/>
  </path>
  <!-- trail -->
  <path d="M760 300 L850 170 L930 195" fill="none" stroke="#FF4D6D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- waypoints -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    <circle cx="760" cy="300" r="15" fill="#5EEAD4"/><text x="760" y="305" fill="#04201D">1</text>
    <circle cx="850" cy="170" r="15" fill="#111720" stroke="#5EEAD4" stroke-width="3"/><text x="850" y="175" fill="#E7EEF6">2</text>
    <circle cx="1010" cy="220" r="15" fill="#111720" stroke="#5EEAD4" stroke-width="3"/><text x="1010" y="225" fill="#E7EEF6">3</text>
    <circle cx="1120" cy="110" r="15" fill="#111720" stroke="#5EEAD4" stroke-width="3"/><text x="1120" y="115" fill="#E7EEF6">4</text>
  </g>

  <!-- live position -->
  <g transform="translate(930 214)">
    <path d="M0 0 L66 -24 A70 70 0 0 1 66 24 Z" fill="url(#beam)" transform="rotate(-18)"/>
    <circle r="12" fill="#FF4D6D" opacity="0.5">
      <animate attributeName="r" values="12;44" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="13" fill="#FFFFFF"/>
    <circle r="9" fill="#FF4D6D"/>
  </g>

  <!-- logo + text -->
  <g transform="translate(88 96)">
    <rect width="88" height="88" rx="24" fill="#111720" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <path d="M44 16c-11 0-20 9-20 20 0 15 20 34 20 34s20-19 20-34c0-11-9-20-20-20z" fill="url(#teal)"/>
    <circle cx="44" cy="36" r="7.5" fill="#0A0E13"/>
  </g>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="88" y="250" font-size="64" font-weight="800" fill="#E7EEF6" letter-spacing="-1.5">Mock Location</text>
    <text x="90" y="296" font-size="24" fill="#8D9AAD">Lokasi palsu untuk Android — teleport, rute &amp; joystick.</text>
    <g transform="translate(90 330)" font-size="15" font-weight="600">
      <rect width="110" height="34" rx="17" fill="#5EEAD4" fill-opacity="0.12" stroke="#5EEAD4" stroke-opacity="0.4"/>
      <text x="55" y="22" text-anchor="middle" fill="#5EEAD4">Tanpa root</text>
      <rect x="122" width="126" height="34" rx="17" fill="#5EEAD4" fill-opacity="0.12" stroke="#5EEAD4" stroke-opacity="0.4"/>
      <text x="185" y="22" text-anchor="middle" fill="#5EEAD4">Android 8–14</text>
      <rect x="260" width="150" height="34" rx="17" fill="#FF4D6D" fill-opacity="0.12" stroke="#FF4D6D" stroke-opacity="0.4"/>
      <circle cx="280" cy="17" r="5" fill="#FF4D6D"/>
      <text x="345" y="22" text-anchor="middle" fill="#FF4D6D">LIVE di peta</text>
    </g>
  </g>
</svg>
