      <text x="20" y="96" font-size="14" fill="#E7EEF6">Tick tiap 500 ms</text>
      <text x="20" y="118" font-size="14" fill="#E7EEF6">RoutePlayer (geo)</text>
      <text x="20" y="140" font-size="14" fill="#E7EEF6">Notifikasi Jeda/Stop</text>
      <text x="20" y="162" font-size="14" fill="#E7EEF6">JoystickOverlay</text>
    </g>
