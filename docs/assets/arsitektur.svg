      <text x="20" y="38" font-size="20" font-weight="800" fill="#E7EEF6">UI (Compose)</text>
      <text x="20" y="64" font-size="14" fill="#8D9AAD">Ui.kt · MainActivity.kt</text>
      <text x="20" y="96" font-size="14" fill="#E7EEF6">Peta osmdroid + Scene</text>
      <text x="20" y="118" font-size="14" fill="#E7EEF6">Panel, pencarian, joystick</text>
    </g>
