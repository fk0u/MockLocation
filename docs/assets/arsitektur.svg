<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t">
  <title id="t">Arsitektur Mock Location: UI Compose, AppVm, MockState, MockService, LocationManager test provider</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5EEAD4"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#FF4D6D"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="28" fill="#0A0E13"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
