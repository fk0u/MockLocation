      <text x="20" y="64" font-size="14" fill="#8D9AAD">ViewModel</text>
      <text x="20" y="96" font-size="14" fill="#E7EEF6">State rute, favorit, setup</text>
      <text x="20" y="118" font-size="14" fill="#E7EEF6">Store (SharedPreferences)</text>
    </g>
