<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t">
  <title id="t">Tiga mode: Teleport, Rute, Joystick</title>
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B8A6"/><stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>
    <radialGradient id="knob" cx="0.35" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#A7F3E6"/><stop offset="1" stop-color="#14B8A6"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="360" rx="28" fill="#0A0E13"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">

    <!-- Teleport -->
    <g transform="translate(30 30)">
      <rect width="360" height="300" rx="24" fill="#111720" stroke="#FFFFFF" stroke-opacity="0.07"/>
      <g transform="translate(180 120)">
        <circle r="46" fill="#5EEAD4" fill-opacity="0.12"/>
        <circle r="24" fill="none" stroke="#5EEAD4" stroke-width="3"/>
        <circle r="9" fill="#FFFFFF"/>
        <path d="M-120 60 q60 -90 110 -62" fill="none" stroke="#8D9AAD" stroke-width="2.5" stroke-dasharray="6 7"/>
        <path d="M-14 -8 l6 12 l-13 1 z" fill="#8D9AAD"/>
      </g>
      <text x="180" y="236" text-anchor="middle" font-size="26" font-weight="800" fill="#E7EEF6">Teleport</text>
      <text x="180" y="266" text-anchor="middle" font-size="16" fill="#8D9AAD">Pindah instan ke satu titik</text>
    </g>

    <!-- Rute -->
    <g transform="translate(420 30)">
      <rect width="360" height="300" rx="24" fill="#111720" stroke="#FFFFFF" stroke-opacity="0.07"/>
      <path d="M70 170 L140 80 L220 140 L290 60" fill="none" stroke="#5EEAD4" stroke-width="4" stroke-dasharray="11 8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M70 170 L140 80 L180 110" fill="none" stroke="#FF4D6D" stroke-width="4" stroke-linecap="round"/>
      <g font-size="13" font-weight="700" text-anchor="middle">
        <circle cx="70" cy="170" r="14" fill="#5EEAD4"/><text x="70" y="175" fill="#04201D">1</text>
        <circle cx="140" cy="80" r="14" fill="#111720" stroke="#5EEAD4" stroke-width="3"/><text x="140" y="85" fill="#E7EEF6">2</text>
        <circle cx="220" cy="140" r="14" fill="#111720" stroke="#5EEAD4" stroke-width="3"/><text x="220" y="145" fill="#E7EEF6">3</text>
        <circle cx="290" cy="60" r="14" fill="#111720" stroke="#5EEAD4" stroke-width="3"/><text x="290" y="65" fill="#E7EEF6">4</text>
      </g>
      <circle cx="180" cy="110" r="11" fill="#FFFFFF"/><circle cx="180" cy="110" r="7.5" fill="#FF4D6D"/>
      <text x="180" y="236" text-anchor="middle" font-size="26" font-weight="800" fill="#E7EEF6">Rute</text>
      <text x="180" y="266" text-anchor="middle" font-size="16" fill="#8D9AAD">Jalan otomatis antar waypoint</text>
    </g>

    <!-- Joystick -->
    <g transform="translate(810 30)">
      <rect width="360" height="300" rx="24" fill="#111720" stroke="#FFFFFF" stroke-opacity="0.07"/>
      <g transform="translate(180 118)">
        <circle r="78" fill="#0E141C" stroke="#FFFFFF" stroke-opacity="0.08"/>
        <circle r="48" fill="none" stroke="#5EEAD4" stroke-opacity="0.3" stroke-width="2"/>
        <g stroke="#5EEAD4" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round">
          <path d="M0 -70v8M70 0h-8M0 70v-8M-70 0h8"/>
        </g>
        <path d="M0 0 L26 -28" stroke="#5EEAD4" stroke-opacity="0.5" stroke-width="4" stroke-linecap="round"/>
        <circle cx="26" cy="-28" r="26" fill="url(#knob)"/>
      </g>
      <text x="180" y="236" text-anchor="middle" font-size="26" font-weight="800" fill="#E7EEF6">Joystick</text>
      <text x="180" y="266" text-anchor="middle" font-size="16" fill="#8D9AAD">Kendalikan arah secara manual</text>
    </g>
  </g>
</svg>
